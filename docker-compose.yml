# ---------------------------------------------------------------------------
# 3-Node Elasticsearch 8.x Cluster
# xpack.security enabled | TLS transport layer | Single-network stack
# ---------------------------------------------------------------------------

services:

  # ---------- Certificate bootstrap (runs once, then exits) ----------
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION}
    container_name: es-setup
    user: "0"
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
    networks:
      - esnet
    command: >
      bash -c '
        if [ ! -f /usr/share/elasticsearch/config/certs/ca/ca.crt ]; then
          echo "Generating CA...";
          bin/elasticsearch-certutil ca --silent --pem \
            -out /usr/share/elasticsearch/config/certs/ca.zip;
          unzip /usr/share/elasticsearch/config/certs/ca.zip \
            -d /usr/share/elasticsearch/config/certs;
        fi;

        if [ ! -f /usr/share/elasticsearch/config/certs/es01/es01.crt ]; then
          echo "Generating node certs...";
          echo -e "instances:\n  - name: es01\n    dns:\n      - es01\n      - localhost\n    ip:\n      - 127.0.0.1\n  - name: es02\n    dns:\n      - es02\n      - localhost\n    ip:\n      - 127.0.0.1\n  - name: es03\n    dns:\n      - es03\n      - localhost\n    ip:\n      - 127.0.0.1\n" > /usr/share/elasticsearch/config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem \
            --ca-cert /usr/share/elasticsearch/config/certs/ca/ca.crt \
            --ca-key  /usr/share/elasticsearch/config/certs/ca/ca.key \
            --in      /usr/share/elasticsearch/config/certs/instances.yml \
            -out      /usr/share/elasticsearch/config/certs/certs.zip;
          unzip /usr/share/elasticsearch/config/certs/certs.zip \
            -d /usr/share/elasticsearch/config/certs;
        fi;

        echo "Setting cert permissions...";
        chown -R 1000:0 /usr/share/elasticsearch/config/certs;
        find /usr/share/elasticsearch/config/certs -type d -exec chmod 750 {} \;;
        find /usr/share/elasticsearch/config/certs -type f -exec chmod 640 {} \;;
        echo "Setup complete.";
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -f /usr/share/elasticsearch/config/certs/es01/es01.crt ]"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- Node 1 (initial master / data) ----------
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION}
    container_name: es01
    depends_on:
      - setup
    environment:
      - node.name=es01
      - cluster.name=${CLUSTER_NAME}
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es02,es03
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=/usr/share/elasticsearch/config/certs/es01/es01.key
      - xpack.security.http.ssl.certificate=/usr/share/elasticsearch/config/certs/es01/es01.crt
      - xpack.security.http.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=/usr/share/elasticsearch/config/certs/es01/es01.key
      - xpack.security.transport.ssl.certificate=/usr/share/elasticsearch/config/certs/es01/es01.crt
      - xpack.security.transport.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
      - ES_JAVA_OPTS=${ES_JAVA_OPTS}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - ${ES_PORT}:9200
    networks:
      - esnet
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert /usr/share/elasticsearch/config/certs/ca/ca.crt \
           https://localhost:9200/_cluster/health \
           -u elastic:${ELASTIC_PASSWORD} | grep -qE '\"status\":\"(green|yellow)\"'"
        ]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # ---------- Node 2 (data) ----------
  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION}
    container_name: es02
    depends_on:
      - setup
    environment:
      - node.name=es02
      - cluster.name=${CLUSTER_NAME}
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es01,es03
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=/usr/share/elasticsearch/config/certs/es02/es02.key
      - xpack.security.http.ssl.certificate=/usr/share/elasticsearch/config/certs/es02/es02.crt
      - xpack.security.http.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=/usr/share/elasticsearch/config/certs/es02/es02.key
      - xpack.security.transport.ssl.certificate=/usr/share/elasticsearch/config/certs/es02/es02.crt
      - xpack.security.transport.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
      - ES_JAVA_OPTS=${ES_JAVA_OPTS}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - esdata02:/usr/share/elasticsearch/data
    networks:
      - esnet
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert /usr/share/elasticsearch/config/certs/ca/ca.crt \
           https://localhost:9200/_cluster/health \
           -u elastic:${ELASTIC_PASSWORD} | grep -qE '\"status\":\"(green|yellow)\"'"
        ]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # ---------- Node 3 (data) ----------
  es03:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION}
    container_name: es03
    depends_on:
      - setup
    environment:
      - node.name=es03
      - cluster.name=${CLUSTER_NAME}
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es01,es02
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=/usr/share/elasticsearch/config/certs/es03/es03.key
      - xpack.security.http.ssl.certificate=/usr/share/elasticsearch/config/certs/es03/es03.crt
      - xpack.security.http.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=/usr/share/elasticsearch/config/certs/es03/es03.key
      - xpack.security.transport.ssl.certificate=/usr/share/elasticsearch/config/certs/es03/es03.crt
      - xpack.security.transport.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
      - ES_JAVA_OPTS=${ES_JAVA_OPTS}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - esdata03:/usr/share/elasticsearch/data
    networks:
      - esnet
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert /usr/share/elasticsearch/config/certs/ca/ca.crt \
           https://localhost:9200/_cluster/health \
           -u elastic:${ELASTIC_PASSWORD} | grep -qE '\"status\":\"(green|yellow)\"'"
        ]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # ---------- Kibana password setup ----------
  setup-users:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION}
    container_name: es-setup-users
    depends_on:
      es01:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
    networks:
      - esnet
    command: >
      bash -c '
        echo "Setting kibana_system password...";
        until curl -s -X POST --cacert /usr/share/elasticsearch/config/certs/ca/ca.crt \
          -u "elastic:${ELASTIC_PASSWORD}" \
          https://es01:9200/_security/user/kibana_system/_password \
          -H "Content-Type: application/json" \
          -d "{\"password\":\"${KIBANA_PASSWORD}\"}" | grep -q ""; do
          echo "Retrying password update...";
          sleep 5;
        done;
        echo "Password set successfully.";
      '
    restart: on-failure

  # ---------- Kibana ----------
  kibana:
    image: docker.elastic.co/kibana/kibana:${ES_VERSION}
    container_name: kibana
    depends_on:
      setup-users:
        condition: service_completed_successfully
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=https://es01:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/kibana/config/certs/ca/ca.crt
    volumes:
      - certs:/usr/share/kibana/config/certs
      - kibanadata:/usr/share/kibana/data
    ports:
      - ${KIBANA_PORT}:5601
    networks:
      - esnet
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'"
        ]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

# ---------- Named volumes ----------
volumes:
  certs:
    driver: local
  esdata01:
    driver: local
  esdata02:
    driver: local
  esdata03:
    driver: local
  kibanadata:
    driver: local

# ---------- Network ----------
networks:
  esnet:
    driver: bridge
